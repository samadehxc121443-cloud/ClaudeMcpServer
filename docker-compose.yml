# LicenseServer orchestration.
#
# Usage:
#   cp .env.example .env   (then edit the secrets)
#   docker compose up --build
#
# All generic, reusable infra services (Postgres, Redis, Vault, Keycloak)
# live in a single compose file that any other orchestration can include
# as one piece. App-specific glue stays in this file.

name: license-server

include:
  - docker/compose.infra.yml

services:
  # One-shot job: seeds the app's secrets into Vault on every `up`.
  # Lives here (not in compose.vault.yml) because WHAT goes into Vault
  # is specific to this orchestration; the Vault server itself is generic.
  vault-init:
    image: hashicorp/vault:1.18
    depends_on:
      vault:
        condition: service_healthy
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN:?VAULT_TOKEN is required — set it in .env}
    restart: "no"
    entrypoint: ["sh", "-c"]
    # Only infrastructure secrets go into Vault. Application credentials
    # (admin keys, license keys) are data and live in the database.
    command:
      - >-
        vault kv put secret/license-server
        ConnectionString='Host=postgres;Port=5432;Database=${POSTGRES_DB:-app};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD}'

  license-server:
    build:
      context: .
      dockerfile: src/ClaudeMcpServer.LicenseServer/Dockerfile
    restart: unless-stopped
    environment:
      # Environment comes from .env so the same orchestration can run as
      # Development (verbose errors, DI validation) or Production (terse).
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Development}
      # The DB connection string is NOT set here on purpose: the app fetches
      # it from Vault at startup using this address + token. Admin keys are
      # not configuration at all — they live in the database.
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_TOKEN}
      REDIS_CONNECTION: "redis:6379,password=${REDIS_PASSWORD}"
      # Keycloak bearer auth for admin endpoints (X-Admin-Key keeps working
      # for machine-to-machine access). Two valid issuers: tokens requested
      # from the host carry the localhost issuer; from inside the network,
      # the service-name issuer.
      Keycloak__MetadataAddress: http://keycloak:8080/realms/license-server/.well-known/openid-configuration
      Keycloak__ValidIssuers__0: http://keycloak:8080/realms/license-server
      Keycloak__ValidIssuers__1: http://localhost:${KEYCLOAK_PORT:-8085}/realms/license-server
    ports:
      - "${LICENSE_SERVER_PORT:-8080}:8080"
    healthcheck:
      # The aspnet image ships no curl/wget; bash /dev/tcp confirms the
      # Kestrel listener is up (the app only binds after migrations ran).
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      vault-init:
        condition: service_completed_successfully
      keycloak:
        condition: service_healthy
