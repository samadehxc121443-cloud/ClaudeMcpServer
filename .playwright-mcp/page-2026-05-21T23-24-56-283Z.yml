              - generic [ref=e5951]: CTO at G2X
          - generic [ref=e5952]:
            - img
            - paragraph [ref=e5954]: "\"Railway streamlines and accelerates our entire operation. It gives us instant observability into our services and makes spinning up self-hosted third-party tools almost effortless. This reduces friction in experimentation and shortens our deployment cycles significantly.\""
