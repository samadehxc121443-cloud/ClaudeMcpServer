# Quality gate: every push and pull request must build with ZERO warnings
# and pass the full test suite. Branch protection requires this check to
# pass before a PR can merge.
name: CI

on:
  push:
    branches: [master, main, development]
  pull_request:
    branches: [master, main, development]

jobs:
  build-and-test:
    name: build-and-test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ClaudeMcpServer.sln

      - name: Build (warnings are errors)
        run: dotnet build ClaudeMcpServer.sln -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test ClaudeMcpServer.sln -c Release --no-build --verbosity normal
