# Generic, reusable Keycloak service (identity provider).
#
# Runs in dev mode: HTTP, embedded DB, realms imported from ./keycloak/import
# on startup. Good for local development and demos — production needs
# `start` with TLS, a real database, and a fixed hostname.
#
# Like Postgres initdb: the SERVER is generic, the realm files a consuming
# orchestration drops into ./keycloak/import are app-specific.

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?KEYCLOAK_ADMIN_PASSWORD is required — set it in .env}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "${KEYCLOAK_PORT:-8085}:8080"
    volumes:
      - ./keycloak/import:/opt/keycloak/data/import:ro
    healthcheck:
      # The Keycloak image ships no curl/wget; bash /dev/tcp against the
      # management port (9000) confirms the server is up and realms imported.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 15s
