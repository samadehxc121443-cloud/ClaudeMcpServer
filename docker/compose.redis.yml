# Generic, reusable Redis service.
#
# Cache-oriented: no persistent volume on purpose — cached data is
# rebuildable by definition. Any orchestration can `include:` this file.

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s
