# Generic, reusable HashiCorp Vault service.
#
# Runs in DEV mode: in-memory storage, auto-unsealed, root token from .env.
# Good for local development and demos — NOT for production (a real Vault
# needs persistent storage, TLS, and proper init/unseal).
#
# Secrets are seeded by the consuming orchestration (see vault-init in the
# root docker-compose.yml): what goes INTO Vault is app-specific, the Vault
# server itself is not.

services:
  vault:
    image: hashicorp/vault:1.18
    restart: unless-stopped
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:?VAULT_TOKEN is required — set it in .env}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
    ports:
      - "${VAULT_PORT:-8200}:8200"
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 3s
